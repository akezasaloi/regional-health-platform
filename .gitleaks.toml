title = "regional-health-platform"

[extend]
useDefault = true

# Generated during `make up` / `make verify`. Hostnames in apply.log / seed.log
# are not committed credentials; scanning them after apply false-fails C8.
[allowlist]
paths = [
  '''(^|/)evidence/''',
  '''(^|/)\.terraform/''',
  '''(^|/)\.tflocal/''',
  '''(^|/)node_modules/''',
]

# C5 gate-test only — must not match db_password = var.db_password or labpassword.
[[rules]]
id = "gate-test-fake-mysql-password"
description = "C5 gate-test marker (assignment fake password only)"
regex = '''MYSQL_ROOT_PASSWORD=Sup3rSecret!'''