# Thin PR trigger. All logic lives in ci.yml so individual repos can call the
# same reusable workflow.
#
# NOTE: the brief's snippet said `secrets: inherit`. zizmor's `secrets-inherit`
# audit fails that (medium), and the acceptance gate requires zizmor to exit 0.
# Listing them explicitly satisfies both, and enforces the reviewer-checklist
# line "scanner jobs must not see AIVEN_* / LOCALSTACK_AUTH_TOKEN": with
# `inherit`, every job in ci.yml is handed the entire secret store.
name: pr

on: [pull_request]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      AIVEN_HOST: ${{ secrets.AIVEN_HOST }}
      AIVEN_PORT: ${{ secrets.AIVEN_PORT }}
      AIVEN_USER: ${{ secrets.AIVEN_USER }}
      AIVEN_PASSWORD: ${{ secrets.AIVEN_PASSWORD }}
      AIVEN_DB: ${{ secrets.AIVEN_DB }}
