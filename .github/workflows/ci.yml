# Golden CI pipeline (C5): gitleaks -> trivy-config -> zizmor -> build+scan image -> apply -> verify.
#
# Pinning policy: every `uses:` is a 40-char commit SHA, never a tag. Dependabot
# (.github/dependabot.yml) bumps them weekly through reviewed PRs.
#
# Secrets policy: the four scanner jobs run with no `secrets:` block and no
# credentials in `env:`. Only deploy-and-verify is trusted with a token.
name: ci

on:
  workflow_call:
    secrets:
      LOCALSTACK_AUTH_TOKEN:
        required: false
      AIVEN_HOST:
        required: false
      AIVEN_PORT:
        required: false
      AIVEN_USER:
        required: false
      AIVEN_PASSWORD:
        required: false
      AIVEN_DB:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0 # full history: a secret is only found in the commit that added it
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Required on pull_request events: the action reads the PR's commit
          # range through the API. This is the short-lived per-job token, not a
          # stored repo secret, and it is capped by permissions: contents: read
          # above. No deployment credential is exposed to this job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR comments, so the job needs no pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  trivy-config:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'

  zizmor:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - run: pipx install zizmor==1.29.0 # pinned, same reason every uses: is a SHA
      - run: zizmor .github/workflows/

  build-and-scan-image:
    needs: [gitleaks, trivy-config, zizmor]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      # ami_tag is the docker tag LocalStack discovers the image by.
      # ami_id is what aws_instance.ami takes — LocalStack rejects the full tag.
      ami_tag: ${{ steps.tag.outputs.ami_tag }}
      ami_id: ${{ steps.tag.outputs.ami_id }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - id: tag
        run: |
          short="$(git rev-parse --short=12 HEAD)"
          echo "ami_tag=localstack-ec2/app:ami-${short}" >> "$GITHUB_OUTPUT"
          echo "ami_id=ami-${short}" >> "$GITHUB_OUTPUT"
      - env:
          AMI_TAG: ${{ steps.tag.outputs.ami_tag }}
        run: docker build -t "$AMI_TAG" ./api
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.tag.outputs.ami_tag }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Report only what we can act on. The Debian base carries ~48
          # HIGH/CRITICAL CVEs with no upstream patch (perl, zlib, util-linux);
          # without this the gate is permanently red no matter what we fix, which
          # trains people to ignore it. Everything fixable still fails the build.
          ignore-unfixed: true

  deploy-and-verify:
    needs: build-and-scan-image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      # MySQL lives on Aiven — LocalStack Hobby 501s on RDS. The Makefile maps
      # AIVEN_* to TF_VAR_db_* and terraform writes them into Secrets Manager.
      AIVEN_HOST: ${{ secrets.AIVEN_HOST }}
      AIVEN_PORT: ${{ secrets.AIVEN_PORT }}
      AIVEN_USER: ${{ secrets.AIVEN_USER }}
      AIVEN_PASSWORD: ${{ secrets.AIVEN_PASSWORD }}
      AIVEN_DB: ${{ secrets.AIVEN_DB }}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # The AMI id, not the docker tag: LocalStack matches the running image by
      # its localstack-ec2/<name>:<ami-id> tag, but aws_instance.ami rejects
      # anything that is not ami-<hex> (InvalidAMIID.Malformed).
      TF_VAR_app_ami_id: ${{ needs.build-and-scan-image.outputs.ami_id }}
      # A runner's $USER is "runner", so the Makefile's default root
      # (terraform/envs/$USER) does not exist. Point it at the template.
      TF_DIR: ${{ github.workspace }}/terraform/envs/_template
      # Docker-backed EC2 (Hobby/Pro) needs the host docker.sock inside the
      # LocalStack container. setup-localstack runs `localstack start -d` and
      # does not always mount the socket — RunInstances then cannot back the
      # instance with a container, and terraform reports
      # "collecting instance settings: couldn't find resource".
      DOCKER_FLAGS: -v /var/run/docker.sock:/var/run/docker.sock
      EC2_VM_MANAGER: docker
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      # Build before LocalStack starts: its EC2 docker backend registers AMIs by
      # scanning images tagged localstack-ec2/<name>:<ami-id>, so the image has
      # to exist first. The scanned image lives on the build job's runner, not
      # this one, so rebuild it here under the identical tag.
      - env:
          AMI_TAG: ${{ needs.build-and-scan-image.outputs.ami_tag }}
        run: docker build -t "$AMI_TAG" ./api
      # Install awslocal only. We start LocalStack ourselves so the docker
      # socket is mounted (required by EC2_VM_MANAGER=docker).
      - uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          install-awslocal: 'true'
          skip-startup: 'true'
      - name: Start LocalStack (CLI + docker.sock + docker VM manager)
        run: |
          : "${LOCALSTACK_AUTH_TOKEN:?FAIL: LOCALSTACK_AUTH_TOKEN is empty in Actions secrets — Pro/Hobby EC2 docker manager will not run}"
          command -v localstack >/dev/null || pipx install localstack
          localstack --version
          # GitHub's docker.sock is often root:docker 660; the LocalStack
          # container must be able to list host images to register AMIs.
          sudo chmod 666 /var/run/docker.sock || true
          export EC2_VM_MANAGER=docker
          export DEBUG=1
          export DOCKER_FLAGS="-v /var/run/docker.sock:/var/run/docker.sock --privileged"
          # Official CLI pulls localstack-pro when AUTH_TOKEN is set and
          # forwards EC2_VM_MANAGER into the container. Plain `docker run`
          # mounted the socket but still listed zero docker AMIs (not even
          # the Ubuntu AMI LocalStack downloads at boot) — that is mock mode.
          localstack start -d
          localstack wait -t 120
          echo ">> LocalStack info (edition / license):"
          curl -sS http://localhost:4566/_localstack/info || true
          echo
          echo ">> container env (EC2 / DOCKER / AUTH present?):"
          docker ps --format '{{.Names}}' | head
          CID="$(docker ps -q --filter ancestor=localstack/localstack-pro --latest || docker ps -q --filter name=localstack | head -1)"
          echo "container=$CID"
          docker exec "$CID" printenv | grep -E '^(EC2_|DOCKER_|LOCALSTACK_AUTH|LICENSE)' || true
      - name: Wait for docker-backed AMIs or fall back to mock EC2
        env:
          AMI_TAG: ${{ needs.build-and-scan-image.outputs.ami_tag }}
          AMI_ID: ${{ needs.build-and-scan-image.outputs.ami_id }}
        run: |
          # Docs canary: same image, AMI id from LocalStack's own examples.
          docker tag "$AMI_TAG" localstack-ec2/app:ami-000001
          echo "waiting for EC2 docker VM manager to list AMIs..."
          n=0
          for i in $(seq 1 15); do
            n="$(awslocal ec2 describe-images --filters Name=tag:ec2_vm_manager,Values=docker --query 'length(Images)' --output text 2>/dev/null || echo 0)"
            echo "  try $i: docker-backed AMI count=$n"
            if [ "$n" != "0" ] && [ "$n" != "None" ] && [ -n "$n" ]; then
              break
            fi
            sleep 2
          done
          {
            echo '## LocalStack AMI diagnostics'
            echo '```'
            echo "expected tag : $AMI_TAG"
            echo "expected id  : $AMI_ID"
            echo "docker AMI count=$n"
            curl -sS http://localhost:4566/_localstack/info || true
            echo
            awslocal ec2 describe-images --filters Name=tag:ec2_vm_manager,Values=docker \
              --query 'Images[].{id:ImageId,name:Name}' --output table || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if awslocal ec2 describe-images --image-ids "$AMI_ID" --query 'Images[0].ImageId' --output text 2>/dev/null | grep -qx "$AMI_ID"; then
            echo "OK: LocalStack registered $AMI_ID"
            echo "EC2_DOCKER=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Hobby/community EC2 stays mock even with docker.sock mounted (same
          # class as RDS/ELBv2). Docker-manager RunInstances then 404s our AMI
          # and terraform dies with "couldn't find resource". Flip to mock so
          # aws_instance can apply; the scanned image runs on the runner later.
          echo "WARN: zero docker-backed AMIs — restarting LocalStack with EC2_VM_MANAGER=mock"
          docker logs "$(docker ps -q --filter name=localstack | head -1)" 2>&1 | tail -40 || true
          localstack stop || true
          export EC2_VM_MANAGER=mock
          echo "EC2_VM_MANAGER=mock" >> "$GITHUB_ENV"
          localstack start -d
          localstack wait -t 120
          MOCK_AMI="$(awslocal ec2 describe-images --query 'Images[0].ImageId' --output text 2>/dev/null || true)"
          if [ -z "$MOCK_AMI" ] || [ "$MOCK_AMI" = "None" ]; then
            echo "FAIL: mock describe-images returned no AMIs"
            docker logs "$(docker ps -q --filter name=localstack | head -1)" 2>&1 | tail -80 || true
            exit 1
          fi
          echo "TF_VAR_app_ami_id=$MOCK_AMI" >> "$GITHUB_ENV"
          echo "EC2_DOCKER=0" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "using mock AMI $MOCK_AMI for terraform; app sidecar after apply"
      # setup-localstack installs awslocal only. tflocal drives Terraform at
      # LocalStack; verify.sh check 5 shells out to gitleaks; seed.sh restores
      # the dump into Aiven with the mysql client.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: pipx install terraform-local
      - env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: |
          command -v mysql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends mysql-client
          }
          mysql --version
          command -v jq >/dev/null || sudo apt-get install -y --no-install-recommends jq
      # envs/_template declares an empty `backend "s3" {}` and expects a
      # backend.hcl. use_path_style matters: bootstrap/tfstate.sh creates the
      # bucket path-style via awslocal, and without it PutObject returns
      # NoSuchBucket even though init can read the state.
      - run: |
          cat > "$TF_DIR/backend.hcl" <<'HCL'
          bucket         = "tfstate-regional-health"
          key            = "envs/ci/terraform.tfstate"
          region         = "us-east-1"
          dynamodb_table = "tfstate-lock"
          encrypt        = true

          # tflocal rewrites the *provider* to talk to LocalStack but leaves the
          # *backend* pointed at real AWS, so init died validating "test" against
          # the real STS (InvalidClientTokenId). Point the backend at LocalStack
          # and skip the credential round-trips that have no meaning here.
          use_path_style              = true
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true

          endpoints = {
            s3       = "http://localhost:4566"
            dynamodb = "http://localhost:4566"
            sts      = "http://localhost:4566"
            iam      = "http://localhost:4566"
          }
          HCL
      # bootstrap creates the state bucket + lock table, so init has somewhere
      # to write. `make up` re-runs a bare `init`, which reuses this cached
      # backend config (standard partial-configuration flow).
      - run: make bootstrap
      - run: tflocal -chdir="$TF_DIR" init -backend-config=backend.hcl
      - run: make up
      # Mock EC2 never runs user_data, so the scanned image has to listen on
      # the runner for /healthz /readyz /debug/secret-source.
      - name: Run scanned image on the runner (mock EC2)
        if: env.EC2_DOCKER != '1'
        env:
          AMI_TAG: ${{ needs.build-and-scan-image.outputs.ami_tag }}
        run: |
          SECRET_ARN="$(tflocal -chdir="$TF_DIR" output -raw secret_arn)"
          docker rm -f capacity-api 2>/dev/null || true
          docker run -d --network host --name capacity-api \
            -e AWS_ENDPOINT_URL=http://127.0.0.1:4566 \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e DB_SECRET_ARN="$SECRET_ARN" \
            "$AMI_TAG"
          echo "ARN length=${#SECRET_ARN}"
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/readyz >/dev/null; then
              echo "OK: sidecar /readyz after ${i} tries"
              curl -fsS http://127.0.0.1:3000/debug/secret-source || true
              echo
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: sidecar never became ready on :3000"
          echo "--- /healthz ---"
          curl -sS -D- http://127.0.0.1:3000/healthz || true
          echo
          echo "--- /readyz ---"
          curl -sS -D- http://127.0.0.1:3000/readyz || true
          echo
          echo "--- /debug/secret-source ---"
          curl -sS -D- http://127.0.0.1:3000/debug/secret-source || true
          echo
          echo "--- docker logs ---"
          docker logs capacity-api 2>&1 | tail -80 || true
          exit 1
      - run: make verify
